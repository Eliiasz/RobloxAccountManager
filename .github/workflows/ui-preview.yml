name: UI Preview

# Renders screenshots of the interface on Windows so layout changes can be
# checked without running the app by hand. Download them from the run's
# artifacts.

on:
  push:
    branches: [main]
    paths:
      - "src/utils/ui.py"
      - "src/utils/icons.py"
      - "src/utils/motion.py"
      - "src/features/color_themes.py"
      - "scripts/ui_preview.py"
      - ".github/workflows/ui-preview.yml"
  workflow_dispatch:

permissions:
  contents: write   # pushes the screenshots to the ui-preview branch

jobs:
  preview:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python
        run: uv python install 3.15

      - name: Sync dependencies
        run: uv sync --locked

      - name: Render screenshots
        shell: bash
        run: |
          mkdir -p ui-preview
          uv run --no-sync python scripts/ui_preview.py ui-preview > ui-preview/render.txt 2>&1 || (cat ui-preview/render.txt; true)

      - name: Test report
        shell: bash
        run: uv run --no-sync python scripts/run_tests.py --suite ui --suite unit -v > ui-preview/tests.txt 2>&1 || true

      - name: Upload screenshots
        uses: actions/upload-artifact@v7
        with:
          name: ui-preview
          path: ui-preview/*
          if-no-files-found: warn
          retention-days: 14

      - name: Publish screenshots to the ui-preview branch
        shell: bash
        run: |
          mkdir preview-branch
          cp ui-preview/* preview-branch/
          cd preview-branch
          git init -q -b ui-preview
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "UI preview for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ui-preview
