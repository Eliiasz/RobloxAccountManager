name: Release

# Publishes a GitHub Release (which the app's updater picks up) automatically
# whenever the version in src/utils/version.py goes up on main and that
# version has not been released yet. The full tests must pass first.
# "Run workflow" re-runs it by hand for the current version.

on:
  push:
    branches: [main]
    paths:
      - "src/utils/version.py"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v7

      - name: Is this version already released?
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c "import re;print(re.search(r'APP_VERSION\s*=\s*\"([^\"]+)\"', open('src/utils/version.py').read()).group(1))")
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "$tag is already released, nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Will publish $tag."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  tests:
    needs: check
    if: needs.check.outputs.publish == 'true'
    uses: ./.github/workflows/tests.yml

  build-and-release:
    needs: [check, tests]
    if: needs.check.outputs.publish == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.check.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python
        run: uv python install 3.15

      - name: Sync dependencies
        run: |
          uv sync --locked --group build

      - name: Build with PyInstaller
        run: uv run --no-sync python scripts/build.py
        env:
          RAM_RELEASE_TAG: ${{ env.RELEASE_TAG }}

      - name: Verify build output
        run: |
          if not exist "dist\ANaneRAM.exe" (
            echo Build output missing.
            exit /b 1
          )
          dir /b "dist\ANaneRAM-v*.exe" >nul 2>&1
          if errorlevel 1 (
            echo Versioned release asset missing.
            exit /b 1
          )
        shell: cmd

      - name: Release notes
        id: notes
        shell: bash
        run: |
          tag="$RELEASE_TAG"
          file="release-notes/$tag.md"
          if [ ! -f "$file" ]; then file="$RUNNER_TEMP/empty-notes.md"; : > "$file"; fi
          echo "path=$file" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: ANAne's Roblox Account Manager ${{ env.RELEASE_TAG }}
          generate_release_notes: false  # notes come only from release-notes/<tag>.md
          fail_on_unmatched_files: true
          body_path: ${{ steps.notes.outputs.path }}
          files: |
            dist/ANaneRAM-v*.exe
            dist/EvanovarRAM-v*.exe
